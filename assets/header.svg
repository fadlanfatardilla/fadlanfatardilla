<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Fadlan Fatardilla Sumaila - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#0b0f2e"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <circle cx="860" cy="170" r="190" fill="url(#orb)">
    <animate attributeName="r" values="180;205;180" dur="5s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="150" cy="330" rx="320" ry="60" fill="#818cf8" opacity="0.10"/>

  <!-- Stars -->
  <g fill="#e0f2fe">
    <circle cx="90" cy="48" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="58" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="26" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="300" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="40" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="975" cy="290" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="190" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Circuit lines -->
  <g fill="none" stroke-linecap="round" filter="url(#softglow)">
    <path d="M0 300H110L140 272H330" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0 318H210L236 296H430" stroke="#e879f9" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="4 12">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1000 36H900L876 12H780" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="5 10">
      <animate attributeName="stroke-dashoffset" values="0;64" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="330" cy="272" r="3.5" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="296" r="3.5" fill="#e879f9" filter="url(#glow)"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>

  <!-- Text -->
  <g font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
    <text x="62" y="92" font-size="16" fill="#22d3ee" letter-spacing="1">&gt; hello, world_
      <animate attributeName="opacity" values="1;1;0.35;1" keyTimes="0;0.6;0.8;1" dur="1.4s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="62" y="158" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="url(#title)" textLength="600" lengthAdjust="spacingAndGlyphs" filter="url(#softglow)">Fadlan Fatardilla Sumaila</text>
  <rect x="62" y="176" width="150" height="3" rx="1.5" fill="url(#title)">
    <animate attributeName="width" values="40;240;40" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="62" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" letter-spacing="2" textLength="620" lengthAdjust="spacing">SOFTWARE ENGINEER  ·  JAVASCRIPT  ·  TYPESCRIPT  ·  PHP  ·  PYTHON</text>
  <text x="62" y="246" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#64748b">// building the future, one commit at a time</text>

  <!-- Robot shadow -->
  <ellipse cx="860" cy="310" rx="58" ry="8" fill="#22d3ee" opacity="0.16">
    <animate attributeName="rx" values="58;44;58" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.08;0.16" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Speech bubble -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    <rect x="738" y="46" width="72" height="34" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M790 80L800 94L806 80Z" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="788" y="78" width="20" height="3" fill="#0f172a"/>
    <text x="774" y="69" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">Hi!</text>
  </g>

  <!-- Robot -->
  <g transform="translate(860 168)">
    <animateTransform attributeName="transform" type="translate" values="860 168;860 158;860 168" dur="3s" repeatCount="indefinite"/>

    <!-- antenna -->
    <line x1="0" y1="-72" x2="0" y2="-94" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-100" r="7" fill="#f472b6" filter="url(#glow)">
      <animate attributeName="r" values="6;9;6" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- ears -->
    <rect x="-74" y="-42" width="12" height="32" rx="6" fill="#22d3ee" filter="url(#softglow)"/>
    <rect x="62" y="-42" width="12" height="32" rx="6" fill="#22d3ee" filter="url(#softglow)"/>

    <!-- head -->
    <rect x="-62" y="-72" width="124" height="90" rx="30" fill="#0f172a" stroke="#22d3ee" stroke-width="3" filter="url(#softglow)"/>
    <rect x="-48" y="-58" width="96" height="62" rx="22" fill="#020617" stroke="#1e293b" stroke-width="2"/>

    <!-- eyes -->
    <ellipse cx="-22" cy="-34" rx="9" ry="11" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;0.44;0.5;0.56;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="22" cy="-34" rx="9" ry="11" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="ry" values="11;11;1;11;11" keyTimes="0;0.44;0.5;0.56;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- cheeks + smile -->
    <circle cx="-38" cy="-12" r="5" fill="#f472b6" opacity="0.55"/>
    <circle cx="38" cy="-12" r="5" fill="#f472b6" opacity="0.55"/>
    <path d="M-15 -12Q0 3 15 -12" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#softglow)"/>

    <!-- neck + body -->
    <rect x="-12" y="18" width="24" height="12" fill="#1e293b"/>
    <rect x="-50" y="28" width="100" height="72" rx="26" fill="#0f172a" stroke="#818cf8" stroke-width="3" filter="url(#softglow)"/>
    <text x="0" y="72" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="18" font-weight="700" fill="#e879f9" filter="url(#softglow)">&lt;/&gt;
      <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- left arm (resting) -->
    <rect x="-70" y="42" width="14" height="46" rx="7" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="-63" cy="94" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>

    <!-- right arm (waving) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-70 50 48;-25 50 48;-70 50 48" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
      <rect x="48" y="41" width="46" height="14" rx="7" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
      <circle cx="98" cy="48" r="9" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>
    </g>
  </g>
</svg>
