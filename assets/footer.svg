<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#0b0f2e"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="0.7" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="120" fill="url(#bg)"/>
  <rect width="1000" height="120" fill="url(#grid)"/>
  <rect x="100" y="30" width="800" height="2" rx="1" fill="url(#line)" filter="url(#glow)"/>
  <circle cx="100" cy="31" r="3" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="100;900;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="70" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#e2e8f0" letter-spacing="1">Thanks for stopping by — let's build something great together.</text>
  <text x="500" y="96" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#64748b">© Fadlan Fatardilla Sumaila</text>
</svg>
